server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/accounts/**

            - id: brand-service
              uri: lb://brand-service
              predicates:
                - Path=/api/v1/brands/**

            - id: watch-service
              uri: lb://watch-service
              predicates:
                - Path=/api/v1/watches/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
